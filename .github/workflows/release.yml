name: release

# Publishing automation. protoRAG ships a single pure-Python distribution;
# the CPU vs full split is expressed through the `full` / `chroma` /
# `sentence-transformers` extras (see pyproject.toml), so one wheel serves
# both audiences: CPU users install the base package, GPU users add
# `.[full]`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
