name: release

# Publishing automation. protoRAG ships a single pure-Python distribution;
# the CPU vs full split is expressed through the `full` / `chroma` /
# `sentence-transformers` extras (see pyproject.toml), so one wheel serves
# both audiences: CPU users install the base package, GPU users add
# `.[full]`.

on:
  push:
    tags: ["v*"]

jobs:
  pypi-publish:
    name: build + publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/protorag
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
